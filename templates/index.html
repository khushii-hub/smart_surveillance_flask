<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Surveillance Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container mt-4">
    <h1>Smart Surveillance Dashboard</h1>
    <form method="POST" enctype="multipart/form-data" class="mb-3">
        <div class="row g-2 align-items-center">
            <div class="col-auto">
                <label for="source" class="form-label">Video Source:</label>
            </div>
            <div class="col-auto">
                <select name="source" id="source" class="form-select">
                    <option value="webcam" {% if video_source == 0 %}selected{% endif %}>Webcam</option>
                    <option value="video.mp4" {% if video_source != 0 %}selected{% endif %}>Sample Video (video.mp4)</option>
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Change Source</button>
            </div>
        </div>
    </form>
    <div class="row">
        <div class="col-md-8">
            <div class="video-container">
                <img src="{{ url_for('video_feed') }}" class="img-fluid" id="video-feed" alt="Video Feed">
            </div>
        </div>
        <div class="col-md-4">
            <h4>Recent Alerts</h4>
            <table class="table table-sm table-striped">
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Label</th>
                        <th>Role</th>
                        <th>Name</th>
                        <th>Conf.</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody>
                {% for alert in alerts %}
                    <tr>
                        <td>{{ alert[0] }}</td>
                        <td>{{ alert[1] }}</td>
                        <td>{{ alert[2] }}</td>
                        <td>{{ alert[3] }}</td>
                        <td>{{ '%.2f'|format(alert[4]) }}</td>
                        <td>{{ alert[5] }}</td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="/static/main.js"></script>
</body>
</html>
